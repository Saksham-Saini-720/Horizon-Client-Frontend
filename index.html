<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.ico"
    />
    <!--
      viewport-fit=cover lets the page paint into the display's rounded corners
      and under the home indicator, instead of being letterboxed inside a safe
      rectangle. It is also what makes env(safe-area-inset-*) report real
      values — without it they are all 0px and any safe-area padding silently
      does nothing. The bottom nav relies on both.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://api.thehorizonproperties.com https://nominatim.openstreetmap.org https://api.bigdatacloud.net https://photon.komoot.io https://ipapi.co; frame-src 'none'; object-src 'none'; base-uri 'self';"
    />
    <meta
      http-equiv="X-Content-Type-Options"
      content="nosniff"
    />
    <!--
      The two brand faces, in one request:
        Fraunces — display/headings. Loaded with italics, since the accent lines
          ("perfect home", "like yours") depend on them, and across the full
          300..900 range so a heavy accent renders at its real weight instead of
          being capped and synthesised.
        Manrope  — UI/body: labels, nav, chips, badges.
      Preconnect first: these are render-blocking, and gstatic is a second host.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Manrope:wght@300..800&display=swap"
      rel="stylesheet"
    />
    <title>Horizon Properties</title>
  </head>
  <body>
    <div id="root"></div>
    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
